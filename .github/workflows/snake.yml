name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # update otomatis tiap hari
  workflow_dispatch:      # bisa dijalankan manual
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2196F3&color_dots=#ebedf0,#bbdefb,#64b5f6,#2196f3,#0d47a1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2196F3&color_dots=#161b22,#0c2d48,#0d47a1,#1976d2,#2196f3

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
